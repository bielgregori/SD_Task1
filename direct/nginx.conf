# ─── NGINX Load Balancer Configuration ──────────────────────────────
#
# Place this file at /etc/nginx/conf.d/ticket_system.conf on the
# load-balancer VM.
#
# Adjust the upstream IP addresses / ports to match your AWS deployment.
# Then: sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────

upstream ticket_backend {
    # Round-robin (default) across worker servers.
    # Add / remove lines to scale dynamically, then: nginx -s reload
    #
    # max_fails / fail_timeout = passive health checking: after 3 failed
    # attempts a backend is taken out of rotation for 10s.  This is what lets
    # the system survive a REST server crash mid-run (fault tolerance):
    # in-flight requests are retried on a healthy backend (see proxy_next_upstream).
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
    # server <vm2_ip>:8001 max_fails=3 fail_timeout=10s;
    # server <vm3_ip>:8001 max_fails=3 fail_timeout=10s;

    keepalive 64;
}

server {
    listen 8080;
    server_name _;

    # Increase timeouts for benchmark bursts
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    location / {
        proxy_pass http://ticket_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # Fault tolerance: if a backend is down or errors, transparently retry
        # the request on the next healthy backend so the client sees no error.
        # Safe here because every buy is idempotent (deduped by request_id).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    location /health {
        proxy_pass http://ticket_backend;
    }
}
