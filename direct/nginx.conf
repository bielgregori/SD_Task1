# ─── NGINX Load Balancer Configuration ──────────────────────────────
#
# Place this file at /etc/nginx/conf.d/ticket_system.conf on the
# load-balancer VM.
#
# Adjust the upstream IP addresses / ports to match your AWS deployment.
# Then: sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────

upstream ticket_backend {
    # Round-robin (default) across worker servers.
    # Add / remove lines to scale dynamically.
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
    # server <vm2_ip>:8001;
    # server <vm3_ip>:8001;
}

server {
    listen 8080;
    server_name _;

    # Increase timeouts for benchmark bursts
    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;

    location / {
        proxy_pass http://ticket_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }

    location /health {
        proxy_pass http://ticket_backend;
    }
}
